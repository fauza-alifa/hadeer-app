name: hadeer_app
description: "Student attendance with Riverpod and Firebase."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.5.0
  firebase_core: ^5.2.0
  firebase_auth: ^7.1.0
  cloud_firestore: ^7.2.0
  intl: ^0.20.3
  camera: ^0.12.2
  image: ^4.13.1
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.6
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/brand/hadeer.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/brand/hadeer.png"
  adaptive_icon_background: "#183D32"
  adaptive_icon_foreground: "assets/brand/hadeer.png"

flutter_native_splash:
  color: "#183D32"
  image: "assets/brand/hadeer.png"
  android: true
  ios: false

  android_12:
    color: "#183D32"
    image: "assets/brand/hadeer.png"
